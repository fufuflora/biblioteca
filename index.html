<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guia • Fufu Flora</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
 --main:#72938d;
 --bg:#fffbf9;
 --footer:#edecea;
}
*{box-sizing:border-box}
html,body{
 margin:0;
 padding:0;
}
body{
 background:var(--bg);
 color:#333;
 font:14px Montserrat,sans-serif;
}
header{
 background:var(--bg);
 border-bottom:1px solid rgba(114,147,141,.10);
}
 
.container{
 max-width:1200px;
 margin:0 auto;
 padding:0 30px;
}
.topbar{
 position:relative;
 display:flex;
 align-items:center;
 height:92px;
}
.back{
 color:var(--main);
 text-decoration:none;
 font-weight:500;
 font-size:14px;
}
.logo{
 position:absolute;
 left:50%;
 transform:translateX(-50%);
}
.logo img{
 width:210px;
 height:auto;
 display:block;
}
.titlebar{
 background:#fff;
 border-bottom:1px solid rgba(114,147,141,.08);
}
.titlewrap{
 padding:26px 30px;
}
h1{
 margin:0;
 font-family:"Playfair Display",serif;
 font-size:28px;
 font-weight:700;
 line-height:1.2;
 color:var(--main);
}
.content{
 padding:32px 30px 60px;
}
.embed{
 background:#fff;
}
.social-footer{
 margin-top:40px;
 background:#cbb899;
}
.social-footer .footer-inner{
 padding:35px 30px;
 display:flex;
 justify-content:center;
 align-items:center;
}
.social-icon{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 width:40px;
 height:40px;
 margin:0 15px;
 border-radius:50%;
 background:#fffbf9;
 color:#cbb899;
 text-decoration:none;
 transition:opacity .2s ease;
}
.social-icon:hover{opacity:.8;}
.icon-inline{display:inline-block;height:1em;overflow:visible;}
.icon-lg{font-size:1.33333em;line-height:.75em;}
.icon-inline.icon-lg{vertical-align:-.225em;}
.social-icon svg{width:16px;height:16px;fill:currentColor;}
</style>
</head>

<header>

    <a class="back" href="https://www.fufuflora.com/biblioteca/">← Voltar para a Biblioteca</a>

    </a>
  </div>
</header>

<section class="titlebar">

    <h1>Guia Básico para Ratos</h1>

</section>

      <button class="next" onclick="moveSlide(1)">›</button>
    </div>
  </div>
</main>
