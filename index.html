<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guia • Fufu Flora</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
 --main:#72938d;
 --bg:#fffbf9;
 --footer:#edecea;
}
*{box-sizing:border-box}
html,body{
 margin:0;
 padding:0;
}
body{
 background:var(--bg);
 color:#333;
 font:14px Montserrat,sans-serif;
}
header{
 background:var(--bg);
 border-bottom:1px solid rgba(114,147,141,.10);
}
 
.container{
 max-width:1200px;
 margin:0 auto;
 padding:0 30px;
}
.topbar{
 position:relative;
 display:flex;
 align-items:center;
 height:92px;
}
.back{
 color:var(--main);
 text-decoration:none;
 font-weight:500;
 font-size:14px;
}
.logo{
 position:absolute;
 left:50%;
 transform:translateX(-50%);
}
.logo img{
 width:130px;
 height:auto;
 display:block;
}
.titlebar{
 background:#fff;
 border-bottom:1px solid rgba(114,147,141,.08);
}
.titlewrap{
 padding:26px 30px;
}
h1{
 margin:0;
 font-family:"Playfair Display",serif;
 font-size:28px;
 font-weight:700;
 line-height:1.2;
 color:var(--main);
}
.content{
 padding:32px 30px 60px;
}
.embed{
 background:transparent;
 width:100%;
 display:flex;
 justify-content:center;
}

.carousel{
 width:100%;
 max-width:520px;
 position:relative;
 overflow:hidden;
 margin:0 auto;
}

.slides{
 width:100%;
}

.slide{
 width:100%;
 height:auto;
 display:none;
}

.slide.active{
 display:block;
}

.prev,
.next{
 position:absolute;
 top:50%;
 transform:translateY(-50%);
 z-index:5;
 width:42px;
 height:42px;
 border:none;
 border-radius:50%;
 background:rgba(255,255,255,.85);
 color:#72938d;
 font-size:32px;
 line-height:1;
 cursor:pointer;
 display:flex;
 align-items:center;
 justify-content:center;
}

.prev{
 left:15px;
}

.next{
 right:15px;
}
.social-footer{
 margin-top:40px;
 background:#cbb899;
}
.social-footer .footer-inner{
 padding:35px 30px;
 display:flex;
 justify-content:center;
 align-items:center;
}
.social-icon{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 width:40px;
 height:40px;
 margin:0 15px;
 border-radius:50%;
 background:#fffbf9;
 color:#cbb899;
 text-decoration:none;
 transition:opacity .2s ease;
}
.social-icon:hover{opacity:.8;}
.icon-inline{display:inline-block;height:1em;overflow:visible;}
.icon-lg{font-size:1.33333em;line-height:.75em;}
.icon-inline.icon-lg{vertical-align:-.225em;}
.social-icon svg{width:16px;height:16px;fill:currentColor;}
</style>
</head>
<body>

<header>
  <div class="container topbar">
    <a class="back" href="https://www.fufuflora.com/biblioteca/">← Voltar para a Biblioteca</a>

    <a class="logo" href="https://www.fufuflora.com/">
      <img src="//acdn-us.mitiendanube.com/stores/005/190/037/themes/common/logo-715392400-1731273569-4f7786893576aa8ec7292192c05de0ca1731273569-480-0.webp" alt="Fufu Flora">
    </a>
  </div>
</header>

<section class="titlebar">
  <div class="container titlewrap">
    <h1>Guia Básico para Ratos</h1>
  </div>
</section>

<main class="container content">
  <div class="embed">
    <div class="carousel">
      <button class="prev" onclick="moveSlide(-1)">‹</button>

      <div class="slides">
        <img src="https://i.ibb.co/rKnnYgZr/1.webp" class="slide active">
        <img src="https://i.ibb.co/6cQtLR36/2.webp" class="slide">
        <img src="https://i.ibb.co/MkqtP9Wh/3.webp" class="slide">
        <img src="https://i.ibb.co/hxP29z65/4.webp" class="slide">
        <img src="https://i.ibb.co/DDVkygk9/5.webp" class="slide">
        <img src="https://i.ibb.co/cSwJrzpC/7.webp" class="slide">
        <img src="https://i.ibb.co/yFmWd4wW/6.webp" class="slide">
        <img src="https://i.ibb.co/35kRLvyT/8.webp" class="slide">
        <img src="https://i.ibb.co/bjP8NSz1/9.webp" class="slide">
        <img src="https://i.ibb.co/mrcKVsMk/10.webp" class="slide">
        <img src="https://i.ibb.co/mrN36M6Z/11.webp" class="slide">
        <img src="https://i.ibb.co/jZRKxswf/12.webp" class="slide">
        <img src="https://i.ibb.co/0yhGSKv9/13.webp" class="slide">
      </div>

      <button class="next" onclick="moveSlide(1)">›</button>
    </div>
  </div>
</main>

<footer class="social-footer">
  <div class="container footer-inner">
    <a class="social-icon" href="https://instagram.com/fufuflora" target="_blank" aria-label="Instagram">
      <svg class="icon-inline icon-lg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
        <path fill="currentColor" d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9S160.5 370.8 224.1 370.8 339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.2 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.5 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.9-26.9 26.9-14.9 0-26.9-12-26.9-26.9s12-26.9 26.9-26.9 26.9 12 26.9 26.9zM398.8 80c-22.1-22.1-51.5-34.2-82.8-34.2H132C67.3 45.8 14.8 98.3 14.8 163v184c0 64.7 52.5 117.2 117.2 117.2h184c64.7 0 117.2-52.5 117.2-117.2V163c0-31.3-12.2-60.7-34.4-83zM398 347c0 42.9-34.9 77.8-77.8 77.8H132c-42.9 0-77.8-34.9-77.8-77.8V163c0-42.9 34.9-77.8 77.8-77.8h188.2c20.8 0 40.4 8.1 55.1 22.8 14.7 14.7 22.8 34.3 22.8 55.1V347z"/>
      </svg>
    </a>
  </div>
</footer>



<script>
let currentSlide = 0;

function moveSlide(direction) {
  const slides = document.querySelectorAll('.slide');

  slides[currentSlide].classList.remove('active');

  currentSlide += direction;

  if (currentSlide >= slides.length) {
    currentSlide = 0;
  }

  if (currentSlide < 0) {
    currentSlide = slides.length - 1;
  }

  slides[currentSlide].classList.add('active');
}
</script>

</body>
</html>
